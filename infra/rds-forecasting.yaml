AWSTemplateFormatVersion: '2010-09-09'
Description: >
  RDS PostgreSQL stack for forecasting-data-product.
  Creates PostgreSQL, security group, subnet group and Secrets Manager credentials.

Parameters:

  ProjectName:
    Type: String
    Default: forecasting-data-product

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where RDS will be deployed.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different Availability Zones.

  DBName:
    Type: String
    Default: forecasting

  DBUsername:
    Type: String
    Default: itam
    NoEcho: false

  DBPassword:
    Type: String
    MinLength: 8
    NoEcho: true
    Description: Master password for PostgreSQL.

  SecretName:
    Type: String
    Default: itam/rds/forecasting/credentials

  DBAllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to connect to PostgreSQL. For MVP only.

Resources:

  RdsCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Ref SecretName
      Description: Credentials for forecasting-data-product PostgreSQL database.
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "dbname": "${DBName}",
          "port": "5432",
          "engine": "postgres"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access for forecasting-data-product MVP
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref DBAllowedCidr
          Description: PostgreSQL access for SageMaker / app MVP
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for forecasting-data-product RDS
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-rds-${AWS::AccountId}'
      DBInstanceClass: db.t3.micro
      Engine: postgres
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: '20'
      StorageType: gp2
      MultiAZ: false
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      BackupRetentionPeriod: 1
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:

  RdsEndpoint:
    Description: PostgreSQL endpoint.
    Value: !GetAtt RdsInstance.Endpoint.Address

  RdsPort:
    Description: PostgreSQL port.
    Value: !GetAtt RdsInstance.Endpoint.Port

  RdsSecretName:
    Description: Secrets Manager secret name.
    Value: !Ref SecretName

  RdsSecretArn:
    Description: Secrets Manager secret ARN.
    Value: !Ref RdsCredentialsSecret

  DBName:
    Description: Database name.
    Value: !Ref DBName
